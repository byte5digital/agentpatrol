[package]
name = "agentpatrol"
description = "Scans the local configuration surfaces of Claude Code and Codex and quarantines what a deterministic rule proves bad."
# The CLI is the crate that goes to crates.io at the first tagged release, as an
# on-demand scanner, after the core, the adapters and the IPC crate it names.
#
# One binary name, two builds (ADR 0008):
# - The crates.io build, the default features. It is what `cargo install
#   agentpatrol` gives: it runs `scan <dir>` in-process and nothing else. It has
#   no code path to the daemon at all: the IPC crate is not even linked,
#   because the daemon answers only the signed tools of its own bundle and a
#   `cargo install`ed binary is not one of them.
# - The in-bundle build, feature `bundle`, which the app's build turns on. It
#   is what the AgentPatrol app ships in its bundle: a client of the daemon
#   (`status`, the action commands, `rule-feed`, the Gate's `gate` and a bare
#   `scan`, which asks the daemon for a Full Scan), and it runs `scan <dir>`
#   in-process as well.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "agentpatrol"
path = "src/main.rs"

[features]
default = []
# The in-bundle build: the daemon client. Everything that reaches the daemon is
# behind it, and so is the IPC crate, and the Apple on-device engine, whose
# helper only the bundle carries.
bundle = ["dep:agentpatrol-ipc", "dep:serde_json", "agentpatrol-core/apple"]

[dependencies]
agentpatrol-adapter-claude-code.workspace = true
agentpatrol-adapter-codex.workspace = true
agentpatrol-adapter-workspace.workspace = true
agentpatrol-core.workspace = true
# The vocabulary the daemon speaks. It is not the daemon: this crate links the
# protocol and the client, never the write side of a store (ADR 0008). Only the
# in-bundle build links it.
agentpatrol-ipc = { workspace = true, optional = true }
# The Gate reads the event JSON an Agent hands it and prints the decision the
# Agent honours. Only the in-bundle build has the Gate.
serde_json = { version = "1.0.151", optional = true }

[dev-dependencies]
# The repository the Folder Scan tests point at is written by this builder,
# never by a git binary.
agentpatrol-adapter-workspace = { workspace = true, features = ["testing"] }
# A temporary folder a test makes removes itself, also when the test fails.
tempfile = "3.27.0"
